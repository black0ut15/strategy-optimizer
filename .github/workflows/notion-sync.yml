name: Sync Commits to Notion

on:
  push:
    branches: [ main, dev, beta, experimental ]

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Sync commit to Notion Dev Log
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DEV_LOG_DB_ID }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          COMMIT_SHA=$(git log -1 --pretty=format:'%h')
          BRANCH="${GITHUB_REF##*/}"
          AUTHOR=$(git log -1 --pretty=format:'%an')
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l || echo "1")
          DATE=$(date -u +"%Y-%m-%d")

          curl -s -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"parent\": { \"database_id\": \"$NOTION_DATABASE_ID\" },
              \"properties\": {
                \"Name\": { \"title\": [{ \"text\": { \"content\": \"$COMMIT_MSG\" } }] },
                \"Commit SHA\": { \"rich_text\": [{ \"text\": { \"content\": \"$COMMIT_SHA\" } }] },
                \"Branch\": { \"select\": { \"name\": \"$BRANCH\" } },
                \"Author\": { \"rich_text\": [{ \"text\": { \"content\": \"$AUTHOR\" } }] },
                \"Files Changed\": { \"number\": $FILES_CHANGED },
                \"Date\": { \"date\": { \"start\": \"$DATE\" } }
              }
            }"
